aid: customerio
url: https://raw.githubusercontent.com/api-evangelist/customerio/refs/heads/main/apis.yml
name: Customer.io
kind: company
description: Customer.io is a customer messaging and marketing automation platform.
  Its APIs let teams pipe behavioral data in, manage people and their attributes,
  trigger campaigns and broadcasts, send transactional email, push, SMS, and in-app
  messages, and stream delivery activity back out via reporting webhooks. The surface
  spans the Track API (basic site-id + api-key auth), the App / Transactional API
  (Bearer), and the Pipelines / Data Pipelines CDP API.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/customerio.png
tags:
- Customer Messaging
- Marketing Automation
- Email
- CDP
- Transactional
